[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_swf_editor"
version = "0.1.0"
description = "Python SWF editor and decompiler with ABC and AVM support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
qt = ["PySide6>=6.5"]
dev = ["pytest", "httpx"]
authors = [
    { name = "Python SWF Editor", email = "noreply@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.scripts]
py_swf_editor = "main:main"
py-swf-web = "server.__main__:main"
